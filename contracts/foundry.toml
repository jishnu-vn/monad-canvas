[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# Monad Testnet Configuration
eth_rpc_url = "https://testnet-rpc.monad.xyz"
chain_id = 10143

# Solidity Compiler Settings
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false

# Gas reporting
gas_reports = ["MonadCanvas"]

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
monad_mainnet = "https://rpc.monad.xyz"

[etherscan]
monad_testnet = { key = "none", url = "https://sourcify-api-monad.blockvision.org/" }
